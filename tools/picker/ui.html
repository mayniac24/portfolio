<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portfolio Picker</title>
<style>
  :root {
    --bg:#141416; --panel:#1c1c20; --line:#2c2c33;
    --fg:#e8e8ea; --dim:#8b8b95; --accent:#d9a441; --ok:#4a9d5f;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif }
  header { position:sticky; top:0; z-index:10; background:var(--panel);
           border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; letter-spacing:.02em }
  select, button { background:#26262c; color:var(--fg); border:1px solid var(--line);
                   border-radius:6px; padding:6px 10px; font:inherit }
  button { cursor:pointer }
  button:hover { border-color:var(--dim) }
  button.primary { background:var(--accent); color:#1a1a1a; border-color:var(--accent);
                   font-weight:600 }
  button.primary:disabled { opacity:.4; cursor:not-allowed }
  .count { color:var(--dim); margin-left:auto; font-variant-numeric:tabular-nums }
  main { padding:14px; display:grid; gap:14px;
         grid-template-columns:repeat(auto-fill,minmax(260px,1fr)) }
  figure { margin:0; background:var(--panel); border:1px solid var(--line);
           border-radius:8px; overflow:hidden; display:flex; flex-direction:column }
  figure.starred { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) }
  .imgwrap { position:relative; aspect-ratio:3/2; background:#0d0d0f; cursor:pointer }
  .imgwrap img { width:100%; height:100%; object-fit:cover; display:block }
  .star { position:absolute; top:6px; right:6px; width:30px; height:30px;
          border-radius:50%; border:none; background:rgba(0,0,0,.6);
          color:#fff; font-size:15px; line-height:1; cursor:pointer }
  figure.starred .star { background:var(--accent); color:#1a1a1a }
  figcaption { padding:7px 9px; font-size:11.5px; color:var(--dim);
               display:flex; justify-content:space-between; gap:6px }
  .meta { color:var(--dim) }
  .badge { padding:1px 6px; border-radius:4px; background:#2a2a31; font-size:10.5px }
  .badge.golden { background:#4a3a18; color:var(--accent) }
  .fields { display:none; padding:0 9px 9px; gap:6px; flex-direction:column }
  figure.starred .fields { display:flex }
  .fields input, .fields select { width:100%; font-size:12px; padding:5px 7px }
  .fields input.missing { border-color:#8a4040 }
  #log { position:fixed; right:14px; bottom:14px; max-width:460px; max-height:45vh;
         overflow:auto; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:10px 12px; font:12px/1.5 ui-monospace,monospace;
         white-space:pre-wrap; display:none }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none;
              align-items:center; justify-content:center; z-index:50; cursor:zoom-out }
  #lightbox img { max-width:94vw; max-height:88vh; object-fit:contain }
  #lightbox figure { background:none; border:none; align-items:center; gap:10px }
  #lbbar { position:fixed; bottom:0; left:0; right:0; padding:10px 16px;
           background:rgba(20,20,24,.94); border-top:1px solid var(--line);
           display:flex; align-items:center; gap:14px; cursor:default; z-index:51 }
  #lbbar .who { font-variant-numeric:tabular-nums; color:var(--dim) }
  #lbbar .name { color:var(--fg) }
  #lbstar { width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
            background:#26262c; color:#fff; font-size:17px; line-height:1; cursor:pointer }
  #lbstar.on { background:var(--accent); color:#1a1a1a; border-color:var(--accent) }
  #lbbar .hint { margin-left:auto; color:var(--dim); font-size:11.5px }
  #lbbar kbd { background:#26262c; border:1px solid var(--line); border-radius:4px;
               padding:1px 5px; font:11px ui-monospace,monospace }
</style>
</head>
<body>
<header>
  <h1>Portfolio Picker</h1>
  <select id="outing"><option value="">All outings</option></select>
  <select id="light"><option value="">All light</option></select>
  <select id="camera"><option value="">All cameras</option></select>
  <label style="color:var(--dim)"><input type="checkbox" id="onlyShort"> <span id="shortLabel">shortlist</span> only</label>
  <label style="color:var(--dim)"><input type="checkbox" id="onlyStarred"> starred only</label>
  <span class="count" id="count"></span>
  <button id="publish" class="primary" disabled>Publish</button>
</header>
<main id="grid"></main>
<div id="log"></div>
<div id="lightbox">
  <img alt="">
  <div id="lbbar">
    <button id="lbstar" title="star (s)">&#9734;</button>
    <span class="who"><span id="lbpos"></span></span>
    <span class="name" id="lbname"></span>
    <span class="hint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> flip &nbsp;
      <kbd>s</kbd> star &nbsp; <kbd>esc</kbd> close</span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const grid = $('#grid'), logEl = $('#log');
let starred = 0;
let cards = [], lbIndex = -1;

function log(msg) { logEl.style.display='block'; logEl.textContent = msg; }

async function loadFacets() {
  const f = await (await fetch('/api/facets')).json();
  for (const [sel, items] of [['#outing', f.outings], ['#light', f.lights],
                              ['#camera', f.cameras]]) {
    for (const it of items) {
      const o = document.createElement('option');
      o.value = it.name; o.textContent = `${it.name} (${it.n})`;
      $(sel).append(o);
    }
  }
  starred = f.starred;
  $('#publish').disabled = starred === 0;
  $('#publish').textContent = `Publish ${starred || ''}`.trim();
  $('#count').textContent = `${f.published} published · ${starred} starred`;
  if (f.shortlist) {
    $('#shortLabel').textContent = `${f.shortlist_label} (${f.shortlist})`;
    // Default ON: a shortlist exists because someone means to work through it,
    // and the unfiltered first paint thumbnails 400 unrelated frames.
    $('#onlyShort').checked = true;
  } else {
    $('#onlyShort').closest('label').style.display = 'none';
  }
}

function card(p) {
  const fig = document.createElement('figure');
  fig.className = p.starred ? 'starred' : '';
  fig.innerHTML = `
    <div class="imgwrap">
      <img loading="lazy" src="/thumb/${encodeURI(p.id)}?s=320" alt="">
      <button class="star" title="star">${p.starred ? '★' : '☆'}</button>
    </div>
    <figcaption>
      <span class="meta">${p.date} ${p.time} · ${p.camera}</span>
      <span class="badge ${p.light === 'golden' ? 'golden' : ''}">${p.light}</span>
    </figcaption>
    <div class="fields">
      <select class="cat">
        <option value="landscape">landscape</option>
        <option value="wedding">wedding</option>
        <option value="maternity">maternity</option>
      </select>
      <input class="alt" placeholder="Alt text (required to publish)"
             value="${(p.alt || '').replace(/"/g, '&quot;')}">
    </div>`;
  if (p.category) fig.querySelector('.cat').value = p.category;
  if (p.starred && !p.alt) fig.querySelector('.alt').classList.add('missing');

  const send = body => fetch('/api/star/' + encodeURI(p.id), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  }).then(r => r.json()).then(r => {
    starred = r.starred;
    $('#publish').disabled = starred === 0;
    $('#publish').textContent = `Publish ${starred || ''}`.trim();
  });

  // Exposed so the lightbox can star the frame you are actually looking at.
  fig._toggle = () => {
    const on = !fig.classList.contains('starred');
    fig.classList.toggle('starred', on);
    fig.querySelector('.star').textContent = on ? '★' : '☆';
    fig.querySelector('.alt').classList.toggle(
      'missing', on && !fig.querySelector('.alt').value.trim());
    send(on ? {category: fig.querySelector('.cat').value,
               alt: fig.querySelector('.alt').value} : {starred:false});
    return on;
  };
  fig._starred = () => fig.classList.contains('starred');
  fig._photo = p;
  fig.querySelector('.star').onclick = e => { e.stopPropagation(); fig._toggle(); syncLB(); };
  fig.querySelector('.imgwrap').onclick = () => openLB(cards.indexOf(fig));
  for (const f of ['.cat', '.alt']) {
    fig.querySelector(f).onchange = () => {
      fig.querySelector('.alt').classList.toggle(
        'missing', !fig.querySelector('.alt').value.trim());
      send({category: fig.querySelector('.cat').value,
            alt: fig.querySelector('.alt').value});
    };
  }
  return fig;
}

function lbSrc(i) { return '/thumb/' + encodeURI(cards[i]._photo.id) + '?s=1600'; }

function syncLB() {
  if (lbIndex < 0) return;
  const fig = cards[lbIndex], p = fig._photo, on = fig._starred();
  $('#lbstar').textContent = on ? '★' : '☆';
  $('#lbstar').classList.toggle('on', on);
  $('#lbpos').textContent = `${lbIndex + 1} / ${cards.length}`;
  $('#lbname').textContent = `${p.id.split('/').pop()}  ·  ${p.date} ${p.time}`;
}

function openLB(i) {
  if (i < 0 || i >= cards.length) return;
  lbIndex = i;
  $('#lightbox img').src = lbSrc(i);
  $('#lightbox').style.display = 'flex';
  syncLB();
  // s=1600 is rendered on demand, so warm the neighbours or every flip stalls.
  for (const j of [i + 1, i - 1])
    if (j >= 0 && j < cards.length) new Image().src = lbSrc(j);
}

function stepLB(d) {
  const n = lbIndex + d;
  if (n < 0 || n >= cards.length) return;      // clamp, so you always know where you are
  openLB(n);
  cards[n].scrollIntoView({block:'center'});
}

function closeLB() { $('#lightbox').style.display = 'none'; lbIndex = -1; }

document.addEventListener('keydown', e => {
  if (lbIndex < 0) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowDown') { e.preventDefault(); stepLB(1); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); stepLB(-1); }
  else if (k === 'Escape') { e.preventDefault(); closeLB(); }
  else if (k === 's' || k === 'S' || k === ' ') {
    e.preventDefault(); cards[lbIndex]._toggle(); syncLB();
  }
});

async function load() {
  const q = new URLSearchParams();
  for (const [k, sel] of [['outing','#outing'],['light','#light'],['camera','#camera']])
    if ($(sel).value) q.set(k, $(sel).value);
  if ($('#onlyShort').checked) q.set('short','1');
  if ($('#onlyStarred').checked) q.set('starred','1');
  grid.innerHTML = '<p style="color:var(--dim)">loading…</p>';
  const d = await (await fetch('/api/photos?' + q)).json();
  grid.innerHTML = '';
  // The library is large; render a slice rather than 20k nodes.
  cards = [];
  for (const p of d.photos.slice(0, 400)) { const f = card(p); cards.push(f); grid.append(f); }
  if (d.total > 400) {
    const n = document.createElement('p');
    n.style.color = 'var(--dim)';
    n.textContent = `showing 400 of ${d.total} — narrow the filters to see the rest`;
    grid.append(n);
  }
}

$('#lightbox').onclick = e => { if (!e.target.closest('#lbbar')) closeLB(); };
$('#lbstar').onclick = () => { cards[lbIndex]._toggle(); syncLB(); };
for (const s of ['#outing','#light','#camera','#onlyShort','#onlyStarred'])
  $(s).onchange = load;

$('#publish').onclick = async () => {
  if (!confirm(`Publish ${starred} photo(s)? This corrects them, generates ` +
               `variants, updates gallery.json and rebuilds index.html. ` +
               `Nothing is committed.`)) return;
  $('#publish').disabled = true;
  log('publishing…');
  const r = await (await fetch('/api/publish', {method:'POST'})).json();
  log((r.ok ? `✓ added ${r.added}\n\n` : `✗ ${r.error}\n\n`) +
      (r.log || []).join('\n'));
  if (r.ok) { await loadFacets(); await load(); }
  else $('#publish').disabled = false;
};

loadFacets().then(load);
</script>
</body>
</html>
